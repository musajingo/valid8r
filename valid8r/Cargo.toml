[package]
name = "valid8r"
description = "Struct validation via #[derive(Validate)]. A fork of the `validator` crate."
authors.workspace = true
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
readme = "README.md"
documentation = "https://docs.rs/valid8r"
keywords = ["validation", "validate", "derive", "serde", "forms"]
categories = ["rust-patterns", "web-programming"]
include = ["src/**", "tests/**", "README.md", "LICENSE-MIT", "LICENSE-APACHE"]

[dependencies]
valid8r_derive = { version = "0.2.2", path = "../valid8r_derive" }

serde.workspace = true
serde_json.workspace = true
regex.workspace = true
card-validate = { version = "2.4", optional = true }
url = { version = "2.5", optional = true }
idna = { version = "1.1", optional = true }
indexmap = { workspace = true, optional = true }
phonenumber = { workspace = true, optional = true }
rust_decimal.workspace = true

[features]
default = []
full = ["email", "phone_number", "cards", "url", "indexmap"]
email = ["dep:idna"] # Activate validating the host part of an email
phone_number = ["dep:phonenumber"]
cards = ["dep:card-validate"]
url = ["dep:url"]
indexmap = ["dep:indexmap"]

[package.metadata.docs.rs]
all-features = true
