[package]
name = "valid8r_derive_tests"
description = "Test for `#[derive(Validate)]` proc macro."
authors.workspace = true
version.workspace = true
edition.workspace = true
publish = false

[features]
# Match the runtime feature guards in the included README examples.
default = ["full"]
full = ["email", "url", "phone_number", "cards", "indexmap"]
email = ["valid8r/email"]
url = ["valid8r/url"]
phone_number = ["valid8r/phone_number"]
cards = ["valid8r/cards"]
indexmap = ["valid8r/indexmap"]

[dependencies]
indexmap.workspace = true

[dev-dependencies]
valid8r = { path = "../valid8r", features = ["full"] }
delta = { git = "https://github.com/musajingo/delta", tag = "v0.1.0" }
serde.workspace = true
serde_json.workspace = true
trybuild = "1.0"
regex.workspace = true
rust_decimal.workspace = true
