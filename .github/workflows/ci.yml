name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt, clippy, tests, features, msrv, packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The MSRV toolchain used by scripts/check.sh; installed first so
      # stable (installed next) remains the default toolchain.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: ./scripts/check.sh
      - name: Verify release packages
        run: cargo +stable package -p valid8r_derive -p valid8r --all-features
