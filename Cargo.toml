[workspace]
resolver = "3"

members = ["validator", "validator_derive", "validator_derive_tests"]

[workspace.package]
authors = ["Musa Mahmoug Jingo <dev.musajingo@pm.me>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/musajingo/validator"
version = "0.4.0"
edition = "2024"
rust-version = "1.94"
publish = true

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
regex = { version = "1.13", default-features = false, features = ["std"] }
rust_decimal = "1.43"
indexmap = { version = "2.14", features = ["serde"] }
phonenumber = "0.3.10"
